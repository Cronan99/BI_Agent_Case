services:
  db:
    image: postgres:17
    container_name: solvigo_db

    environment:
      POSTGRES_DB: solvigo
      POSTGRES_USER: solvigo_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvigo_app -d solvigo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: solvigo_backend

    environment:
      DATABASE_URL: postgresql+psycopg2://solvigo_app:${POSTGRES_PASSWORD}@db:5432/solvigo
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
        
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: solvigo_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: