services:
  db:
    image: postgres:17
    container_name: solvigo_db

    environment:
      POSTGRES_DB: solvigo
      POSTGRES_USER: solvigo_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: